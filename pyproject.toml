[project]
name = "ear-db-export"
version = "0.6.0"
description = "Read-only export of EAR data (and of slurmdbd's accounting data): tables as stored, or layouts for analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pymysql>=1.1",
    "pyarrow>=14",
    "tomli>=1.1; python_version < '3.11'",  # stdlib tomllib only exists from 3.11
]

[project.scripts]
ear-db-export = "ear_db_export.cli:main"
slurm-db-export = "slurm_db_export.cli:main"

[dependency-groups]
dev = ["pytest>=7"]
# Sphinx documentation (how to build it: docs/development.rst). sphinxcontrib-mermaid 2
# needs Python 3.10.
docs = ["sphinx>=7", "sphinx-rtd-theme>=2", "sphinx-design>=0.5", "myst-parser>=3",
        "sphinxcontrib-mermaid>=1.2,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ear_db_export", "src/slurm_db_export"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a live database (EAR: set EAR_EXPORT_TEST_CONF; Slurm: SLURM_EXPORT_TEST_ARGS)"]

[project]
name = "ear-db-export"
version = "0.4.0"
description = "Read-only export of EAR data: bundles of its tables, and analysis datasets"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pymysql>=1.1",
    "pyarrow>=14",
    "tomli>=1.1; python_version < '3.11'",  # stdlib tomllib only exists from 3.11
]

[project.scripts]
ear-db-export = "ear_db_export.cli:main"

[dependency-groups]
dev = ["pytest>=7"]
# Sphinx documentation: uv run --group docs sphinx-build -b html docs docs/_build/html
docs = ["sphinx>=7", "sphinx-rtd-theme>=2", "sphinx-design>=0.5", "myst-parser>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ear_db_export"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a live EAR database (set EAR_EXPORT_TEST_CONF)"]

[tables.signatures.columns]
id = "id"
dc_power = "node_power"
dram_power = "dram_power"
pck_power = "pck_power"
gbs = "dram_bandwidth"
io_mbs = "io_bandwidth"
tpi = "TPI"
cpi = "CPI"
gflops = "cpu_gflops"
time = "elapsed_time"
perc_mpi = "perc_MPI"
l1_misses = "L1_misses"
l2_misses = "L2_misses"
l3_misses = "L3_misses"
flops_1 = "sp64_ops"
flops_2 = "sp128_ops"
flops_3 = "sp256_ops"
flops_4 = "sp512_ops"
flops_5 = "dp64_ops"
flops_6 = "dp128_ops"
flops_7 = "dp256_ops"
flops_8 = "dp512_ops"
instructions = "instructions"
cycles = "cycles"
avg_f = "avg_cpu_freq"
avg_imc_f = "avg_imc_freq"
def_f = "def_cpu_freq"
cpu_util = "cpu_util"
min_gpu_sig_id = "min_GPU_sig_id"

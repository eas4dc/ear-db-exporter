gpu_power = "GPU_power"
gpu_freq = "GPU_freq"
gpu_mem_freq = "GPU_mem_freq"
gpu_util = "GPU_util"
gpu_mem_util = "GPU_mem_util"
gpu_gflops = "GPU_gflops"
gr_engine_active = "gr_engine_active"
sm_active = "sm_active"

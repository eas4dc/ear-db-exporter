# EAR 4.3 schema. Built from the DDL in EAR 4.3.1's edb_create
# (src/commands/ear_create_database.c); not yet run against a live 4.3 database.
# EAR 5.0 - 6.x use the ear6 profile.
#
# Differences vs ear6:
#   - Jobs key column is `id`, not `job_id`.
#   - No local_id in Jobs/Applications/Loops (NULL; jobs join on job_id, step_id).
#   - Signatures.cpu_util and GPU_signatures.GPU_gflops do not exist (NULL).
#   - Periodic_metrics avg_f/temp/DRAM/PCK/GPU_energy exist only with
#     DBReportNodeDetail=1; L1-3_misses/FLOPS1-8/instructions/cycles only with
#     DBReportSigDetail=1. Missing ones are exported as NULL.

[tables.periodic_metrics]
name = "Periodic_metrics"
[tables.periodic_metrics.columns]
id = "id"
start_time = "start_time"
end_time = "end_time"
node_id = "node_id"
job_id = "job_id"
step_id = "step_id"
dc_energy = "DC_energy"
avg_f = "avg_f"
temp = "temp"
dram_energy = "DRAM_energy"
pck_energy = "PCK_energy"
gpu_energy = "GPU_energy"

[tables.jobs]
name = "Jobs"
[tables.jobs.columns]
job_id = "id"
step_id = "step_id"
user_id = "user_id"
user_acc = "user_acc"
user_group = "user_group"
app_name = "app_id"            # app_id holds the application *name* (varchar)
start_time = "start_time"
end_time = "end_time"
start_mpi_time = "start_mpi_time"
end_mpi_time = "end_mpi_time"
policy = "policy"
threshold = "threshold"
procs = "procs"
job_type = "job_type"
def_f = "def_f"
e_tag = "e_tag"

[tables.applications]
name = "Applications"
[tables.applications.columns]
job_id = "job_id"
step_id = "step_id"
node_id = "node_id"
signature_id = "signature_id"
power_signature_id = "power_signature_id"

[tables.power_signatures]
name = "Power_signatures"
[tables.power_signatures.columns]
id = "id"
dc_power = "DC_power"
dram_power = "DRAM_power"
pck_power = "PCK_power"
edp = "EDP"
max_dc_power = "max_DC_power"
min_dc_power = "min_DC_power"
time = "time"
avg_f = "avg_f"
def_f = "def_f"

[tables.signatures]
name = "Signatures"
[tables.signatures.columns]
id = "id"
dc_power = "DC_power"
dram_power = "DRAM_power"
pck_power = "PCK_power"
edp = "EDP"
gbs = "GBS"
io_mbs = "IO_MBS"
tpi = "TPI"
cpi = "CPI"
gflops = "Gflops"
time = "time"
perc_mpi = "perc_MPI"
l1_misses = "L1_misses"
l2_misses = "L2_misses"
l3_misses = "L3_misses"
flops_1 = "FLOPS1"
flops_2 = "FLOPS2"
flops_3 = "FLOPS3"
flops_4 = "FLOPS4"
flops_5 = "FLOPS5"
flops_6 = "FLOPS6"
flops_7 = "FLOPS7"
flops_8 = "FLOPS8"
instructions = "instructions"
cycles = "cycles"
avg_f = "avg_f"
avg_imc_f = "avg_imc_f"
def_f = "def_f"
min_gpu_sig_id = "min_GPU_sig_id"
max_gpu_sig_id = "max_GPU_sig_id"

[tables.gpu_signatures]
name = "GPU_signatures"
[tables.gpu_signatures.columns]
id = "id"
gpu_power = "GPU_power"
gpu_freq = "GPU_freq"
gpu_mem_freq = "GPU_mem_freq"
gpu_util = "GPU_util"
gpu_mem_util = "GPU_mem_util"

[tables.loops]
name = "Loops"
[tables.loops.columns]
event = "event"
size = "size"
level = "level"
job_id = "job_id"
step_id = "step_id"
node_id = "node_id"
total_iterations = "total_iterations"
signature_id = "signature_id"

[tables.events]
name = "Events"
[tables.events.columns]
id = "id"
timestamp = "timestamp"
event_type = "event_type"
job_id = "job_id"
step_id = "step_id"
value = "value"
node_id = "node_id"

[tables.periodic_aggregations]
name = "Periodic_aggregations"
[tables.periodic_aggregations.columns]
id = "id"
start_time = "start_time"
end_time = "end_time"
dc_energy = "DC_energy"
eardbd_host = "eardbd_host"

[tables.global_energy]
name = "Global_energy"
[tables.global_energy.columns]
energy_percent = "energy_percent"
warning_level = "warning_level"
time = "time"
inc_th = "inc_th"
p_state = "p_state"
energy_consumed_t1 = "GlobEnergyConsumedT1"
energy_consumed_t2 = "GlobEnergyConsumedT2"
energy_limit = "GlobEnergyLimit"
energy_period_t1 = "GlobEnergyPeriodT1"
energy_period_t2 = "GlobEnergyPeriodT2"
energy_policy = "GlobEnergyPolicy"

# Copies of Applications, Jobs and Signatures for the learning phase
[tables.learning_applications]
name = "Learning_applications"
like = "applications"

[tables.learning_jobs]
name = "Learning_jobs"
like = "jobs"

[tables.learning_signatures]
name = "Learning_signatures"
like = "signatures"

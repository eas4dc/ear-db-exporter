# Synthetic ear.conf for tests: same syntax as a real one, no real hosts or users.
# DB configuration
DBIp=db.example.org
DBUser=ear_daemon
DBPassw=not-used
# User and password for usermode queries.
DBCommandsUser=ear_commands
DBCommandsPassw=pa#ss
DBDatabase=EAR
DBPort=3306
DBReportNodeDetail=1
DBReportSIGDetail=1

NodeDaemonPowermonFreq=60
#include=/opt/ear/etc/ear/extra.conf
TmpDir=/var/ear
EtcDir=/opt/ear/etc
AdminUsers=root

# Tags
Tag=cpu_a default=yes max_avx512=2.2 max_avx2=2.6 max_power=5000 min_power=50 error_power=5000 coeffs=coeffs.default
Tag=gpu_a max_avx512=2.2 max_avx2=2.6 max_power=5000 min_power=50 error_power=5000 coeffs=coeffs.default

# Islands
Island=0 Nodes=cpu[001-010,013-014],cpu[101-104] EARGMID=1 tag=cpu_a EARDBD_IP=db.example.org
Island=0 Nodes=gpu[01-04] EARGMID=1 tag=gpu_a EARDBD_IP=db.example.org
Island=0 Nodes=misc1,misc2 EARGMID=1 tag=cpu_a EARDBD_IP=db.example.org
Island=1 Nodes=login[1-2] EARDBD_IP=db.example.org
